spring.application.name=speedtype

# --- Database: PostgreSQL ---
# The PostgreSQL driver will NOT create the database for you — create it first:
#   psql -U postgres -c "CREATE DATABASE speedtype;"
spring.datasource.url=jdbc:postgresql://localhost:5432/speedtype
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=parth1303

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

# --- JWT ---
jwt.secret=speedtype-dev-secret-key-please-change-this-to-something-long-and-random-in-production
jwt.expiration-ms=86400000
